<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panzer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f1e1; --card: #fffdf6; --ink: #2b2620; --soft: #6b6255; --line: #e2d8c2;
    --yellow: #f2c94c; --red: #e8594f; --green: #6fcf6f; --blue: #4f86e8; --orange: #f2994a;
    --r1: 255px 15px 225px 15px / 15px 225px 15px 255px;
    --r2: 15px 225px 15px 255px / 255px 15px 225px 15px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive; font-size: 18px; user-select: none; -webkit-user-select: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; }
  .hand { font-family: 'Gochi Hand', cursive; }
  .sketch { background: var(--card); border: 3px solid var(--ink); border-radius: var(--r1); box-shadow: 5px 6px 0 rgba(43,38,32,.18); }
  .btn { cursor: pointer; background: #fff; border: 3px solid var(--ink); padding: 6px 18px; border-radius: var(--r2);
    box-shadow: 3px 4px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease; font-size: 19px; }
  .btn:hover:not(:disabled) { transform: translate(-1px,-1px) rotate(-1deg); box-shadow: 4px 5px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: translate(2px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { font-size: 16px; padding: 2px 12px; box-shadow: 2px 3px 0 var(--ink); border-width: 2px; }
  .btn.yellow { background: var(--yellow); }
  .btn.green { background: #9fe0a0; }
  .iconbtn { cursor: pointer; width: 44px; height: 44px; display: grid; place-items: center; background: #fff; border: 3px solid var(--ink);
    border-radius: 12px 6px 14px 5px; box-shadow: 2px 3px 0 var(--ink); position: relative; }
  .iconbtn:hover { transform: rotate(-3deg); }
  .iconbtn svg { width: 24px; height: 24px; }
  .badge { position: absolute; top: -8px; right: -8px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--red);
    color: #fff; border: 2px solid var(--ink); font-size: 14px; line-height: 18px; text-align: center; }
  input.field { font: inherit; font-size: 24px; padding: 8px 14px; width: 100%; text-align: center; border: 3px solid var(--ink); background: #fff;
    outline: none; color: var(--ink); border-radius: 225px 15px 255px 15px / 15px 255px 15px 225px; user-select: text; }
  input.field:focus { box-shadow: 0 0 0 4px var(--yellow); }
  canvas { display: block; }
  .screen { position: fixed; inset: 0; }

  /* ---------- Name ---------- */
  #login { display: grid; place-items: center; padding: 16px; background: var(--paper); }
  #loginBg { width: 100%; height: 100%; }
  #login .card { padding: 34px 34px 28px; width: min(440px, 100%); text-align: center; display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 1; }
  .logo { font-family: 'Gochi Hand', cursive; font-size: 84px; line-height: .9; transform: rotate(-3deg); text-shadow: 4px 4px 0 var(--yellow); letter-spacing: 2px; margin: 0; }
  #loginMsg { color: var(--soft); min-height: 22px; }

  /* ---------- Lobby ---------- */
  #lobby { display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 3px solid var(--ink); background: var(--card); position: relative; z-index: 3; }
  .topbar .logo { font-size: 46px; text-shadow: 3px 3px 0 var(--yellow); }
  .tabs { display: flex; gap: 6px; margin-left: 14px; }
  .tab { cursor: pointer; background: none; border: none; font-family: 'Gochi Hand', cursive; font-size: 28px; padding: 2px 12px; color: var(--soft); }
  .tab.on { color: var(--ink); text-decoration: underline wavy var(--yellow) 3px; text-underline-offset: 6px; }
  .grow { flex: 1; }
  .lvl { display: flex; align-items: center; gap: 8px; }
  .lvl .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--yellow); display: grid; place-items: center;
    font-family: 'Gochi Hand', cursive; font-size: 22px; line-height: 1; }
  .lvl .bar { width: 120px; height: 14px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; overflow: hidden; }
  .lvl .bar i { display: block; height: 100%; background: var(--green); }
  .lvl small { display: block; color: var(--soft); font-size: 14px; }
  .namebtn { cursor: pointer; border: none; background: none; font-size: 22px; font-weight: bold; padding: 0 4px; }
  .namebtn:hover { text-decoration: underline; }

  .stagewrap { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  .playbox { position: absolute; right: 26px; bottom: 26px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 2; }
  .mode { background: var(--card); border: 3px solid var(--ink); border-radius: 10px 4px 12px 4px; padding: 4px 14px; text-align: left; }
  .mode b { font-family: 'Gochi Hand', cursive; font-size: 26px; display: block; line-height: 1; }
  .mode span { color: var(--soft); font-size: 16px; }
  #btnPlay { font-family: 'Gochi Hand', cursive; font-size: 58px; padding: 6px 48px 10px; background: var(--yellow); border-width: 4px; box-shadow: 6px 7px 0 var(--ink); min-width: 330px; }
  #btnPlay.searching { background: #fff; font-size: 34px; }
  #queueInfo { font-size: 18px; color: var(--soft); min-height: 22px; }
  .partybox { position: absolute; left: 26px; bottom: 26px; z-index: 2; display: flex; gap: 10px; align-items: center; }

  /* Spind */
  #locker { position: absolute; inset: 0; overflow-y: auto; padding: 26px; }
  #locker h2 { font-family: 'Gochi Hand', cursive; font-size: 40px; margin: 0 0 4px; }
  #locker .sub { color: var(--soft); margin-bottom: 18px; }
  .skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .skin { cursor: pointer; padding: 10px; text-align: center; border: 3px solid var(--ink); background: #fff; border-radius: 18px 6px 20px 8px / 8px 20px 6px 18px; position: relative; }
  .skin:hover { transform: rotate(-1deg) translateY(-2px); }
  .skin.on { box-shadow: 0 0 0 5px var(--yellow); }
  .skin.locked { cursor: default; opacity: .55; }
  .skin.locked:hover { transform: none; }
  .skin canvas { width: 150px; height: 100px; margin: 0 auto; }
  .skin .n { font-size: 20px; font-weight: bold; }
  .skin .l { font-size: 15px; color: var(--soft); }

  /* Freunde-Leiste */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--card); border-left: 3px solid var(--ink);
    z-index: 20; transform: translateX(105%); transition: transform .22s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: -6px 0 0 rgba(43,38,32,.12); }
  #drawer.open { transform: none; }
  .dhead { display: flex; align-items: center; padding: 14px 16px; border-bottom: 3px solid var(--ink); }
  .dhead h3 { font-family: 'Gochi Hand', cursive; font-size: 32px; margin: 0; flex: 1; }
  .dadd { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 2px dashed var(--line); }
  .dadd input { font: inherit; font-size: 18px; flex: 1; min-width: 0; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 8px 3px 9px 4px; outline: none; user-select: text; }
  .dbody { overflow-y: auto; flex: 1; padding: 6px 16px 20px; }
  .sec { font-family: 'Gochi Hand', cursive; font-size: 22px; margin: 14px 0 6px; color: var(--soft); }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 2px dotted var(--line); }
  .row .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  .row .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 19px; }
  .row .st { font-size: 14px; color: var(--soft); display: block; }
  .row .x { cursor: pointer; border: none; background: none; color: var(--soft); font-size: 20px; padding: 0 4px; }
  .row .x:hover { color: var(--red); }
  .empty { color: var(--soft); font-size: 16px; padding: 6px 4px; }

  /* Einladungen */
  #invites { position: fixed; top: 84px; right: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .inv { padding: 14px 16px; width: 300px; animation: pop .35s ease-out; }
  .inv b { font-size: 20px; }
  .inv .acts { display: flex; gap: 8px; margin-top: 10px; }
  @keyframes pop { 0% { transform: scale(.7) rotate(-5deg); opacity: 0; } 70% { transform: scale(1.04) rotate(1deg); opacity: 1; } 100% { transform: none; } }

  #toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 40; pointer-events: none; }
  .toast { background: var(--card); border: 2px solid var(--ink); padding: 6px 16px; border-radius: 12px 4px 14px 5px; box-shadow: 3px 3px 0 rgba(0,0,0,.2); animation: tin .25s ease-out; }
  @keyframes tin { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Spiel ---------- */
  #game { cursor: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  #mini { position: absolute; top: 12px; right: 12px; width: 190px; height: 190px; border: 3px solid var(--ink); border-radius: 10px 4px 12px 4px; background: var(--paper); }
  #feed { position: absolute; top: 212px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none; font-size: 16px; }
  #feed div { background: rgba(255,253,246,.92); border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; max-width: 320px; }
  #feed div.mine { background: var(--yellow); }
  #hudTop { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .pill { display: inline-flex; gap: 14px; align-items: center; background: rgba(255,253,246,.94); border: 3px solid var(--ink); border-radius: 12px 4px 14px 5px; padding: 2px 14px; font-size: 20px; }
  .pill b { font-family: 'Gochi Hand', cursive; font-size: 28px; line-height: 1; }
  #zoneInfo { margin-top: 6px; font-size: 18px; display: inline-block; background: rgba(255,253,246,.94); border: 2px solid var(--ink); border-radius: 8px; padding: 0 10px; }
  #zoneInfo.warn { background: #cfd8ff; }
  #hudBottom { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .hp { width: 360px; max-width: 80vw; height: 30px; border: 3px solid var(--ink); background: #fff; border-radius: 10px 4px 12px 4px; position: relative; overflow: hidden; }
  .hp i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); transition: width .15s; }
  .hp i.lag { background: #ffb4a8; transition: width .6s .25s; }
  .hp span { position: absolute; inset: 0; text-align: center; font-family: 'Gochi Hand', cursive; font-size: 22px; line-height: 24px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip { border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; font-size: 16px; background: #fff; }
  #mates { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .mate { background: rgba(255,253,246,.94); border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; width: 180px; font-size: 16px; }
  .mate .mb { height: 7px; border: 1.5px solid var(--ink); border-radius: 4px; margin-top: 2px; overflow: hidden; background: #fff; }
  .mate .mb i { display: block; height: 100%; background: var(--green); }
  .mate.dead { opacity: .5; text-decoration: line-through; }
  #center { position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
  #center .big { font-family: 'Gochi Hand', cursive; font-size: clamp(40px, 7vw, 86px); text-shadow: 3px 3px 0 var(--yellow); line-height: 1; animation: pop .3s ease-out; }
  #center .small { font-size: 22px; background: rgba(255,253,246,.9); border: 2px solid var(--ink); border-radius: 8px; padding: 0 10px; display: inline-block; margin-top: 6px; }
  #vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px 40px rgba(70,90,220,.55); opacity: 0; transition: opacity .3s; }
  #hurt { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(220,50,40,.6); opacity: 0; }
  .overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; padding: 22px 34px; min-width: 340px; cursor: default; z-index: 5; }
  .overlay .t { font-family: 'Gochi Hand', cursive; font-size: 64px; line-height: 1; }
  .overlay .s { color: var(--soft); font-size: 20px; margin: 6px 0 12px; }
  .stats { display: flex; gap: 22px; justify-content: center; margin: 10px 0 16px; }
  .stats div { font-size: 16px; color: var(--soft); }
  .stats b { display: block; font-family: 'Gochi Hand', cursive; font-size: 36px; color: var(--ink); line-height: 1; }
  .overlay .acts { display: flex; gap: 10px; justify-content: center; }
  #deathCard { top: auto; bottom: 90px; transform: translateX(-50%); padding: 12px 24px; }
  #deathCard .t { font-size: 40px; }
  #tutorial { position: absolute; left: 50%; top: 76%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; z-index: 4; }
  #tutorial div { font-family: 'Gochi Hand', cursive; font-size: clamp(30px, 4.4vw, 54px); background: rgba(255,253,246,.94); border: 4px solid var(--ink);
    padding: 10px 28px; border-radius: var(--r1); box-shadow: 6px 7px 0 rgba(43,38,32,.25); animation: pop .35s ease-out; max-width: 90vw; }

  #fps { position: absolute; left: 12px; bottom: 10px; font-size: 14px; color: var(--soft); pointer-events: none; }

  @media (max-width: 760px) {
    .topbar .logo { font-size: 34px; } .tabs { margin-left: 0; } .tab { font-size: 22px; } .lvl .bar, .lvl small { display: none; }
    #btnPlay { font-size: 42px; min-width: 220px; } #mini { width: 130px; height: 130px; } #feed { top: 150px; }
  }
</style>
</head>
<body>

<!-- Name -->
<div id="login" class="screen">
  <canvas id="loginBg" class="screen"></canvas>
  <div class="card sketch">
    <h1 class="logo">PANZER</h1>
    <input id="nameInput" class="field" maxlength="16" placeholder="Dein Name" autocomplete="off">
    <button id="btnLogin" class="btn yellow" style="font-size:26px">Weiter</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- Lobby -->
<div id="lobby" class="screen hidden">
  <div class="topbar">
    <div class="logo">PANZER</div>
    <div class="tabs">
      <button class="tab on" data-tab="stage">Lobby</button>
      <button class="tab" data-tab="locker">Spind</button>
    </div>
    <div class="grow"></div>
    <div class="lvl">
      <canvas id="rankIcon" width="150" height="150" style="width:64px;height:64px;margin:-6px 0 -10px"></canvas>
      <div><b id="rankName" class="hand" style="font-size:22px;line-height:1">Bronze I</b><div class="bar"><i id="xpBar" style="width:0"></i></div><small id="xpText">0 / 100 RP</small></div>
    </div>
    <button class="namebtn" id="btnName" title="Name ändern"></button>
    <button class="iconbtn" id="btnSound" title="Ton an/aus"></button>
    <button class="iconbtn" id="btnFriends" title="Freunde">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2b2620" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.8-.3 5 1.3 5.6 4.6"/></svg>
      <span class="badge hidden" id="friendBadge">0</span>
    </button>
  </div>
  <div class="stagewrap">
    <canvas id="stage"></canvas>
    <div id="locker" class="hidden">
      <h2>Spind</h2>
      <div class="sub">Neue Lackierungen schaltest du mit höherem Rang frei.</div>
      <div class="skins" id="skins"></div>
    </div>
    <div class="partybox" id="partybox">
      <button class="btn small" id="btnLeaveParty">Party verlassen</button>
    </div>
    <div class="playbox" id="playbox">
      <div class="mode"><b>BATTLE ROYALE</b><span id="modeSub">Solo</span></div>
      <button class="btn" id="btnPlay">SPIELEN</button>
      <div id="queueInfo"></div>
    </div>
  </div>
</div>

<!-- Freunde -->
<div id="drawer">
  <div class="dhead"><h3>Freunde</h3><button class="iconbtn" id="btnCloseDrawer" title="Schließen">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2b2620" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dadd"><input id="addName" maxlength="16" placeholder="Name des Spielers"><button class="btn small yellow" id="btnAdd">Hinzufügen</button></div>
  <div class="dbody" id="dbody"></div>
</div>

<div id="invites"></div>

<!-- Spiel -->
<div id="game" class="screen hidden">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="hurt"></div>
  <canvas id="mini"></canvas>
  <div id="feed"></div>
  <div id="mates"></div>
  <div id="hudTop">
    <div class="pill"><span><b id="hAlive">0</b> übrig</span><span><b id="hKills">0</b> Kills</span></div><br>
    <div id="zoneInfo"></div>
  </div>
  <div id="hudBottom">
    <div class="chips" id="chips"></div>
    <div class="hp"><i class="lag" id="hpLag"></i><i id="hpBar"></i><span id="hpText">100</span></div>
  </div>
  <div id="center"></div>
  <div id="tutorial"></div>
  <div id="fps"></div>
  <div id="deathCard" class="overlay sketch hidden">
    <div class="t">Ausgeschieden</div>
    <div class="s" id="deathBy"></div>
    <div class="acts"><button class="btn small" id="btnSpec">Nächster Spieler</button><button class="btn small yellow" id="btnLobby1">Zur Lobby</button></div>
  </div>
  <div id="resultCard" class="overlay sketch hidden">
    <canvas id="resRank" width="200" height="200" style="width:100px;height:100px;margin:0 auto -6px"></canvas>
    <div class="t" id="resTitle"></div>
    <div class="s" id="resSub"></div>
    <div class="stats">
      <div><b id="resKills">0</b>Kills</div><div><b id="resDmg">0</b>Schaden</div><div><b id="resXp">0</b>Rangpunkte</div>
    </div>
    <div class="acts"><button class="btn small" id="btnWatch">Weiter zuschauen</button><button class="btn yellow" id="btnLobby2">Zur Lobby</button></div>
  </div>
</div>

<div id="toasts"></div>

<script src="draw.js"></script>
<script src="client.js"></script>
<script src="game.js"></script>
</body>
</html>
